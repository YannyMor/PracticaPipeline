name: Blue-Green Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Leer estado actual y calcular objetivo
        id: estado
        run: |
          CURRENT=$(ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cat /etc/nginx/current_deploy.env | grep CURRENT_COLOR | cut -d'=' -f2")
          echo "Color actual: $CURRENT"
          if [ "$CURRENT" == "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi
          echo "Color objetivo: $TARGET"
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Ejecutar switch en servidor
        run: |
          TARGET=${{ steps.estado.outputs.target }}
          export APP_TARGET_IP="127.0.0.1"
          export APP_TARGET_PORT=$([ "$TARGET" == "blue" ] && echo "8080" || echo "8081")
          export DEPLOYMENT_COLOR=$(echo "$TARGET" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            export APP_TARGET_IP='127.0.0.1'
            export APP_TARGET_PORT='$APP_TARGET_PORT'
            export DEPLOYMENT_COLOR='$DEPLOYMENT_COLOR'
            envsubst '\${APP_TARGET_IP} \${APP_TARGET_PORT} \${DEPLOYMENT_COLOR}' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf
            sudo systemctl reload nginx
            echo "CURRENT_COLOR=$TARGET" | sudo tee /etc/nginx/current_deploy.env
          "

      - name: Verificar despliegue
        run: |
          sleep 3
          COLOR=$(curl -sI http://${{ secrets.SERVER_HOST }} | grep X-Deployment-Color | tr -d '[:space:]')
          echo "Header recibido: $COLOR"